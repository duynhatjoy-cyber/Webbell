    <!-- Orbit Dots -->
    <circle cx="17" cy="13.5" r="3" fill="#5FB9C2"/>
    <circle cx="54.5" cy="28.5" r="3" fill="#5FB9C2"/>
    <circle cx="47" cy="35.5" r="3" fill="#4A5873"/>
    <circle cx="44" cy="52.5" r="2.8" fill="#5FB9C2"/>

    <!-- Center Bell Silhouette (Navy) -->
    <path d="M30 22.5 C28.7 22.5 27.7 23.5 27.7 24.8 V25.4 C23.2 26.5 20.5 30.4 20.5 35.8 V39.5 L17.8 42.2 C17.1 42.9 17.6 44.2 18.7 44.2 H41.3 C42.4 44.2 42.9 42.9 42.2 42.2 L39.5 39.5 V35.8 C39.5 30.4 36.8 26.5 32.3 25.4 V24.8 C32.3 23.5 31.3 22.5 30 22.5 Z" fill="#122745"/>
    <!-- Bell Clapper -->
    <path d="M27.3 44.2 C27.3 45.9 28.5 47.2 30 47.2 C31.5 47.2 32.7 45.9 32.7 44.2 Z" fill="#122745"/>
  </g>
</svg>
