<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean white squircle background so the icon stands out on both Light & Dark browser tabs -->
  <rect width="64" height="64" rx="15" fill="#ffffff"/>
  
  <g transform="translate(4, 2)">
    <!-- Outer "b" stem & bottom arc (Navy) -->
    <path d="M7 4 V33 C7 46.8 18.2 57 32 57 C35.8 57 39.4 56.1 42.6 54.5" fill="none" stroke="#122745" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Top-right outer orbit arc (Navy) -->
    <path d="M23.5 11.2 C26.2 10.4 29 10 32 10 C41.2 10 49.1 15.2 52.8 22.8" fill="none" stroke="#122745" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Bottom-right outer orbit segment (Navy) -->
    <path d="M54.2 38.5 C53.1 42.6 50.9 46.3 47.9 49.2" fill="none" stroke="#122745" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Inner left arc (Navy) -->
    <path d="M14.2 29.5 C15.8 22.2 22.3 16.8 30 16.8" fill="none" stroke="#122745" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Inner right arc (Teal) -->
